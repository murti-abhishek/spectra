[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectra"
version = "0.1.0"
description = "Benchmarking framework for single-cell foundation models with liver-specific tasks"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Install scanpy via conda (conda-forge) to avoid llvmlite/numba build issues
analysis = [
    "scanpy>=1.10",
]
spatial = [
    "squidpy>=1.5",
]
# Phase 2: Geneformer + CELLxGENE — install torch separately via conda or setup_ec2.sh
geneformer = [
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "accelerate>=0.30",
    "cellxgene-census",
]

[project.scripts]
spectra = "spectra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["spectra"]
