models:
  - geneformer
  - scgpt
  - uce
  - nicheformer
  - livertransformer
  - pca_baseline

tasks:
  - cell_type_annotation
  - batch_integration
  - liver_cell_type_annotation
  - zonation_prediction
  - fetal_adult_discrimination
