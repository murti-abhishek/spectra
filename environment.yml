name: spectra
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - anndata>=0.10
  # scanpy installed via conda to avoid llvmlite/numba build issues on macOS
  - scanpy>=1.10
  - scikit-learn>=1.4
  - scipy>=1.12
  - numpy>=1.26
  - pandas>=2.2
  - pyyaml>=6.0
  - tqdm>=4.66
  - pytest>=8.0
  - pytest-cov>=5.0
  # CPU PyTorch for local dev — EC2 setup_ec2.sh replaces with CUDA build
  - pytorch::pytorch>=2.2
  - pip
  - pip:
      - -e ".[dev]"
      - transformers>=4.40
      - huggingface_hub>=0.23
      - accelerate>=0.30
      - cellxgene-census
